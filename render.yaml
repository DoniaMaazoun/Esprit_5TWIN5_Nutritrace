# ==========================================================================
# Render Blueprint — Nutritrace / Farm to Fork (100 % gratuit)
# Render → New → Blueprint → choisir ce dépôt. Un service est créé :
#   nutritrace : l'application monolithique (image construite depuis le Dockerfile), offre gratuite
#
# La base est un MySQL 8 externe gratuit (Aiven for MySQL, offre Free) : ses informations de
# connexion sont saisies dans Render (variables « sync: false »), jamais dans le dépôt.
#
# Le déploiement n'est PAS automatique sur chaque push : c'est le pipeline GitHub Actions
# qui le déclenche (Deploy Hook) uniquement quand les tests et le build Docker ont réussi sur main.
# ==========================================================================
services:
  - type: web
    name: nutritrace
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Farm to Fork
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # à saisir : résultat de « php artisan key:generate --show »
      - key: APP_URL
        sync: false          # à saisir : https://nutritrace.onrender.com (URL du service)
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false          # Aiven : Host (ex. mysql-xxxx.aivencloud.com)
      - key: DB_PORT
        sync: false          # Aiven : Port
      - key: DB_DATABASE
        value: defaultdb     # base créée par Aiven
      - key: DB_USERNAME
        value: avnadmin      # utilisateur créé par Aiven
      - key: DB_PASSWORD
        sync: false          # Aiven : Password
      - key: DB_SSL_CA_PEM
        sync: false          # Aiven : contenu du « CA certificate » (connexion TLS obligatoire)
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SEED_DEMO_DATA
        value: "true"        # charge les comptes de démo au premier démarrage (base vide uniquement)
      - key: AI_API_KEY
        sync: false          # optionnel : clé Groq/OpenAI ; vide = moteur IA local
