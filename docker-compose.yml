# ==========================================================================
# Nutritrace — environnement Docker Desktop
#
#   Base de données seule (développement avec « php artisan serve ») :
#       docker compose up -d
#       → MySQL sur 127.0.0.1:3307, phpMyAdmin sur http://localhost:8081
#
#   Application complète en conteneur (comme en production) :
#       docker compose --profile app up -d --build
#       → http://localhost:8080   (port modifiable avec la variable APP_PORT)
# ==========================================================================
name: nutritrace

services:
  db:
    image: mysql:8.0
    container_name: nutritrace-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: farm_to_fork
      MYSQL_USER: nutritrace
      MYSQL_PASSWORD: nutritrace
      MYSQL_ROOT_PASSWORD: root
      TZ: Africa/Tunis
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"   # 3307 pour ne pas entrer en conflit avec le MySQL de XAMPP (3306)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    container_name: nutritrace-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    image: nutritrace-app:local
    container_name: nutritrace-app
    restart: unless-stopped
    environment:
      APP_NAME: "Farm to Fork"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Définissez APP_KEY (dans .env ou l'environnement)}
      APP_URL: http://localhost:${APP_PORT:-8080}
      APP_LOCALE: fr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: farm_to_fork
      DB_USERNAME: nutritrace
      DB_PASSWORD: nutritrace
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SEED_DEMO_DATA: "true"
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:80"   # autre port si 8080 est pris : APP_PORT=8090 docker compose --profile app up -d
    volumes:
      - app_uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_uploads:
